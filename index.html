<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 10 ثواني</title>
    <meta name="description" content="اختبر دقتك! أوقف المؤقت عند 10.00 ثانية بالضبط">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <svg class="background-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
                <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0.3" />
            </linearGradient>
            <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.3" />
                <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
            </linearGradient>
        </defs>
        
        <path d="M0,50 Q250,100 500,50 T1000,50 T1500,50 T2000,50" stroke="url(#grad1)" stroke-width="2" fill="none" class="wave-path wave-1"/>
        <path d="M0,100 Q250,50 500,100 T1000,100 T1500,100 T2000,100" stroke="url(#grad2)" stroke-width="2" fill="none" class="wave-path wave-2"/>
        <path d="M0,150 Q250,200 500,150 T1000,150 T1500,150 T2000,150" stroke="url(#grad1)" stroke-width="2" fill="none" class="wave-path wave-3" opacity="0.5"/>
        <path d="M0,200 Q250,150 500,200 T1000,200 T1500,200 T2000,200" stroke="url(#grad2)" stroke-width="2" fill="none" class="wave-path wave-4" opacity="0.5"/>
        
        <circle cx="100" cy="50" r="3" fill="#8B5CF6" opacity="0.6" class="pulse-dot"/>
        <circle cx="300" cy="100" r="3" fill="#EC4899" opacity="0.6" class="pulse-dot delay-1"/>
        <circle cx="500" cy="150" r="3" fill="#8B5CF6" opacity="0.6" class="pulse-dot delay-2"/>
        <circle cx="700" cy="200" r="3" fill="#EC4899" opacity="0.6" class="pulse-dot delay-3"/>
    </svg>

    <div class="logo">
        <img src="https://i.postimg.cc/HLcCYdgc/logo-ras-removebg-preview.png" alt="RAS Logo">
    </div>

    <div class="best-score" id="bestScore">
        <p class="score-label">أفضل نتيجة</p>
        <p class="score-value" id="bestScoreValue">0.00</p>
    </div>

    <main class="container">
        <header class="header">
            <h1>تحدي الـ 10 ثواني</h1>
            <p class="subtitle">أوقف المؤقت عند 10.00 ثانية بالضبط!</p>
        </header>

        <div class="timer-wrapper">
            <div class="timer-glow"></div>
            <div class="timer-container">
                <div class="timer" id="timer">0.00</div>
            </div>
        </div>

        <div class="buttons">
            <button class="liquid-button" id="startBtn">
                <span>ابدأ</span>
            </button>
            <button class="liquid-button" id="stopBtn" disabled>
                <span>أوقف</span>
            </button>
        </div>

        <div class="result" id="result"></div>

           </main>

    <script src="index.js"></script>
</body>
</html>
