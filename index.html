<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ 10 ثواني | RAS</title>
    <meta name="description" content="اختبر دقتك وسرعة رد فعلك في تحدي الـ 10 ثواني! هل تستطيع إيقاف المؤقت عند 10.00 بالضبط؟">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Background Animation -->
 <svg class="background-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
                <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0.3" />
            </linearGradient>
            <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.3" />
                <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
            </linearGradient>
        </defs>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <img src="logo-ras.png" alt="https://i.postimg.cc/7Y8Gt3Fh/Whats-App-Image-2025-09-21-at-18-31-05-f084af55-removebg-preview.png">
        </div>

        <!-- Best Score -->
        <div class="best-score" id="bestScoreContainer" style="display: none;">
            <p class="best-score-label">أفضل نتيجة</p>
            <p class="best-score-value" id="bestScoreValue">0.00</p>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1 class="title">تحدي الـ 10 ثواني</h1>
                <p class="subtitle">أوقف المؤقت عند 10.00 ثانية بالضبط!</p>
            </div>

            <!-- Timer Display -->
            <div class="timer-wrapper">
                <div class="timer-glow"></div>
                <div class="timer-container" id="timerContainer">
                    <div class="timer" id="timer">0.00</div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="buttons">
                <button class="liquid-button" id="startBtn">ابدأ</button>
                <button class="liquid-button" id="stopBtn" style="display: none;">أوقف</button>
                <button class="liquid-button" id="tryAgainBtn" style="display: none;">حاول مرة أخرى</button>
            </div>

            <!-- Result -->
            <div class="result" id="result" style="display: none;"></div>

            <!-- Instagram QR Code -->
            <div class="qr-container" id="qrContainer" style="display: none;">
                <h3 class="qr-title">📱 تابعنا على الإنستغرام</h3>
                <div class="qr-image-wrapper">
                    <img src="instagram-qr.jpg" alt="Instagram QR Code - @ieee_ras_ju" class="qr-image">
                </div>
                <p class="qr-handle">@ieee_ras_ju</p>
            </div>

           
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
